<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>FreeTimeKit — Hafta sonu masası</title>
</head>
<body>
<x-dc>
<helmet>
<!-- Fontlar: Bricolage Grotesque + Figtree -->
<style>
body{margin:0;background:#F7F5F0}
a{color:#8A5A0B}a:hover{color:#6B4608}
</style>
</helmet>
<div style="width: 390px; height: 860px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F7F5F0; color: #1B1F1E; font-family: 'Figtree', system-ui, sans-serif">

<header style="padding: 12px 20px 0; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
<a href="01-bugun.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E8E2D7; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="#1B1F1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
</header>

<div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 800">Hafta sonu masası</h1>
<span style="font-size: 15px; color: #5E6562">Göbeklitepe</span>
</div>

<ul aria-label="Bilgi sorularından puanlar" style="margin: 16px 20px 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<li style="padding: 10px 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E2D7; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #FBF0D6; color: #8A5A0B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800">A</span>
<span style="font-size: 14px; font-weight: 600">Ayşe</span>
<span style="font-size: 13px; font-weight: 600; color: #5E6562">3 puan</span>
</li>
<li style="padding: 10px 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E2D7; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #FBF0D6; color: #8A5A0B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800">M</span>
<span style="font-size: 14px; font-weight: 600">Mert</span>
<span style="font-size: 13px; font-weight: 600; color: #5E6562">2 puan</span>
</li>
<li style="padding: 10px 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E2D7; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #FBF0D6; color: #8A5A0B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800">D</span>
<span style="font-size: 14px; font-weight: 600">Deniz</span>
<span style="font-size: 13px; font-weight: 600; color: #5E6562">2 puan</span>
</li>
<li style="padding: 10px 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E2D7; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #FBF0D6; color: #8A5A0B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800">C</span>
<span style="font-size: 14px; font-weight: 600">Can</span>
<span style="font-size: 13px; font-weight: 600; color: #5E6562">1 puan</span>
</li>
</ul>

<section style="margin: 14px 20px 0; padding: 20px; background: #FFFFFF; border: 1px solid #E8E2D7; border-radius: 24px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #FBF0D6; color: #8A5A0B; font-size: 12px; font-weight: 700">Tartışma · 1 / 2</span>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; text-wrap: pretty">Yazının ve şehirlerin olmadığı bir çağda insanlar bu kadar büyük bir işi nasıl örgütlemiş olabilir?</p>
<span style="font-size: 14px; color: #5E6562">Puan yok; sadece sohbet.</span>
</section>

<section aria-label="Süre" style="margin: 12px 20px 0; padding: 14px 14px 14px 20px; background: #FFFFFF; border: 1px solid #E8E2D7; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">03:00</span>
<span style="font-size: 13px; color: #5E6562">Süre isteğe bağlı</span>
</span>
<button aria-label="Süreyi başlat" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: #FBF0D6; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.8l-10-6.5A1 1 0 0 0 8 5.5z" fill="none" stroke="#8A5A0B" stroke-width="2" stroke-linejoin="round"></path></svg></button>
</section>

<div style="margin: 20px 20px 0; display: flex; flex-direction: column; gap: 8px">
<label for="table-note" style="font-size: 15px; font-weight: 700">Ne sonuca vardık?</label>
<textarea id="table-note" rows="3" style="box-sizing: border-box; width: 100%; min-height: 100px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid #948C80; background: #FFFFFF; font: inherit; font-size: 16px; line-height: 1.45; color: #1B1F1E; resize: none">Belki bir şölen ya da ortak av için toplandılar; iş bölümü sandığımızdan eski olabilir.</textarea>
</div>

<a href="#" style="position: absolute; left: 20px; right: 20px; bottom: 28px; height: 54px; border-radius: 999px; background: #F0B23F; color: #3A2A06; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; box-shadow: 0 12px 24px -12px rgba(138, 90, 11, 0.55)">Sonraki soru<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#3A2A06" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>

</div>
</x-dc>

</body>
</html>
